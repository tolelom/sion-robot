name: Sion Robot Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: 개발 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: pytest 실행 (+커버리지)
        run: |
          python -m pytest tests/ \
            --cov=sion_robot \
            --cov-report=term \
            --cov-fail-under=80
