name: Sion Robot Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: 개발 의존성 설치
        run: pip install -r requirements-dev.txt

      - name: pytest 실행 (+커버리지)
        # 로봇 모듈은 저장소 루트에 평평하게 있고 `from map_loader import ...`처럼 import하므로
        # cwd가 저장소 루트여야 한다. (tests/conftest.py가 sys.path에 루트를 끼워 넣는다.)
        run: |
          python -m pytest tests/ \
            --cov=astar --cov=path_utils --cov=map_loader \
            --cov=state --cov=mode_manager --cov=follow_path --cov=path_planner \
            --cov=controller --cov=hardware \
            --cov-report=term \
            --cov-fail-under=80
